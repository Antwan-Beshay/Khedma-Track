<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="keywords"
      content="نظام تحضير الخدمة, خدمة الكنيسة, إدارة الخدام, نظام إدارة الكنيسة, تحضير الدروس, مدارس الأحد, جدول الخدمة, حضور الخدام, إدارة الفصول, Church Service Preparation System, Church Management System, Sunday School Management, Volunteer Management, Service Scheduling, Lesson Preparation, Attendance System, Django Project, Bootstrap Dashboard"
    />
    <meta name="author" content="Antwan Beshay" />
    <meta name="robots" content="index, follow" />
    <meta name="theme-color" content="#1E3A5F" />
    {% if title %}
    <title>Sps - {{ title }}</title>
    {% else %}
    <title>Sps</title>
    {% endif %}
    <link
      rel="icon"
      type="image/png"
      href="{{ url_for('static', filename='img/Top_logo-removebg-preview.png') }}"
    />
    <link
      rel="stylesheet"
      type="text/css"
      href="{{ url_for('static', filename='style.css') }}"
    />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <script defer src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
  </head>
  <body>

    <header>
      <div class="lhead">
        <img src="{{ url_for('static', filename='img/Top_logo-removebg-preview.png') }}" alt="logo in head" class="lhead">
      </div>

      <div>
        <img src="{{ url_for('static', filename='img/Bell.png') }}" class="bell" id="bell" alt="Notifications">
        {% if notification %}
        <div class="reddot"></div>
        {% endif %}
      </div>

      <p class="user" onclick="window.location.href='Profile.html'">{{ session.get("fname") }} {{ session.get("lname") }}</p>

      <div class="profile">
        <img src="{{ url_for('static', filename='img/profile.png') }}" alt="profile-icon" class="profile">
      </div>
    </header>

     <section class="notification" id="notification">

    {% if notification %}


        <div class="message">
            <h4 class="content" id="notif-title">{{ notification.title }}</h4>

            <p class="content" id="notif-message">
            
                {{ notification.message }}
            </p>
        </div>

        <button class="delete" type="button">
            <img src="{{ url_for('static', filename='img/delet.png') }}" alt="delete" class="delet" >
        </button>

    {% else %}

        <div class="">
            <center>
            <p class="No">No notifications.</p>
            </center>
        </div>

    {% endif %}

</section>

    <aside>
      <center>
        <a href="{{ url_for('write') }}">
          <i class="bi bi-journal-check"
             style="{% if request.endpoint == 'write' %}color:#0066cc;{% else %}color:#1e293b;{% endif %}"
             data-bs-toggle="tooltip"
             data-bs-placement="right"
             data-bs-title="Write a post for students"></i>
        </a>
      </center>
    </aside>

    <script>
        console.log("JavaScript Loaded");
      document.getElementById('bell').onclick = function() {
    var menu = document.getElementById('notification');
    if (menu.style.display === "none" || menu.style.display === "") {
        menu.style.display = "block";
    } else {
        menu.style.display = "none";
    }
};

        console.log("JavaScript Loaded");
      document.getElementById('bell').onclick = function() {
    var menu = document.getElementById('notification');
    if (menu.style.display === "none" || menu.style.display === "") {
        menu.style.display = "block";
    } else {
        menu.style.display = "none";
    }
};
    </script>
  </body>
</html>
