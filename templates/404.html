<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Page Not Found</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body{
            margin:0;
            background:#f5f7fb;
            font-family:Arial,sans-serif;
            display:flex;
            justify-content:center;
            align-items:center;
            height:100vh;
        }

        .card{
            width:600px;
            max-width:90%;
            border:none;
            border-radius:20px;
            text-align:center;
            padding:40px;
            box-shadow:0 10px 30px rgba(0,0,0,.1);
        }

        h1{
            font-size:130px;
            color:#0052a3;
            margin-bottom:10px;
        }

        p{
            color:#1e293b;
            font-size:18px;
        }

        .btn{
            color:#fff;
            background-color:#0052a3;
            text-decoration:none;
            font-size:28px;
            margin-top:20px;
            border-radius:10px;
            padding:10px 25px;
        }
        .btn:hover{
            background-color:#003f7f;
            border-color:#003f7f;
            box-shadow:0 5px 15px rgba(0,0,0,5.1);
        }
        h3{
            color:#0052a3;
            margin-bottom:20px;
        }
    </style>
</head>
<body>

<div class="card">
    <h1>404</h1>

    <h3>Page Not Found</h3>

    <p>
        Sorry, the page you are looking for does not exist or has been moved.
    </p>

  {% if session.get("role") == "teacher" %} 
<a href="{{ url_for('Teacher') }}" class="btn btn-primary"> back to home 
</a> 
{% elif session.get("role") == "student" %}
 <a href="{{ url_for('Dashboard') }}" class="btn btn-primary"> back to home 
 </a> 
  {% elif session.get("role") == "admin" %} 
 <a href="{{ url_for('admin') }}" class="primary"> back to home 
 </a>
 {% else %} 
 <a href="{{ url_for('login') }}" class="btn btn-primary"> log in 
 </a> 
 {% endif %}
</div>

</body>
</html>
