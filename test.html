 <!DOCTYPE html>
    <html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
    </head>

    <body style="
        margin:0;
        padding:40px 0;
        background:#eef4ff;
        font-family:Arial, Helvetica, sans-serif;
    ">

        <div style="
            width:90%;
            max-width:450px;
            margin:auto;
            background:#ffffff;
            padding:40px 25px;
            text-align:center;
            border-radius:25px;
            box-shadow:0 20px 50px rgba(30,58,95,0.18);
        ">

            <!-- استبدال الأيقونة بكود SVG متوافق مع كافة برامج الإيميل -->
            <div style="
                width:80px;
                height:80px;
                margin:auto;
                border-radius:50%;
                background:#eef4ff;
                border:2px solid #1E3A5F;
                display: flex;
                align-items: center;
                justify-content: center;
            ">
               <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-key" viewBox="0 0 16 16">
  <path d="M0 8a4 4 0 0 1 7.465-2H14a.5.5 0 0 1 .354.146l1.5 1.5a.5.5 0 0 1 0 .708l-1.5 1.5a.5.5 0 0 1-.708 0L13 9.207l-.646.647a.5.5 0 0 1-.708 0L11 9.207l-.646.647a.5.5 0 0 1-.708 0L9 9.207l-.646.647A.5.5 0 0 1 8 10h-.535A4 4 0 0 1 0 8m4-3a3 3 0 1 0 2.712 4.285A.5.5 0 0 1 7.163 9h.63l.853-.854a.5.5 0 0 1 .708 0l.646.647.646-.647a.5.5 0 0 1 .708 0l.646.647.646-.647a.5.5 0 0 1 .708 0l.646.647.793-.793-1-1h-6.63a.5.5 0 0 1-.451-.285A3 3 0 0 0 4 5"/>
  <path d="M4 8a1 1 0 1 1-2 0 1 1 0 0 1 2 0"/>
</svg>
            </div>

            <h2 style="
                color:#1E3A5F;
                margin-top:25px;
            ">
                Reset Your Password
            </h2>

            <p style="
                color:#24324a;
                font-size:16px;
                line-height:1.7;
            ">
                We received a request to reset your password.
            </p>

            <p style="
                color:#24324a;
                font-size:16px;
            ">
                Your verification code is:
            </p>

            <div style="
                margin:25px auto;
                padding:18px;
                width:180px;
                background:#eef4ff;
                border:2px solid #1E3A5F;
                border-radius:15px;
                color:#1E3A5F;
                font-size:32px;
                font-weight:bold;
                letter-spacing:8px;
            ">
                1234
            </div>

            <p style="
                color:#667085;
                font-size:14px;
                line-height:1.6;
            ">
                Enter this code on the SPS password reset page.
            </p>

            <p style="
                color:#667085;
                font-size:13px;
            ">
                If you did not request this code, you can safely ignore
                this email.
            </p>

            <hr style="
                border:0;
                border-top:1px solid #eeeeee;
                margin:30px 0;
            ">

            <p style="
                color:#667085;
                font-size:13px;
            ">
                SPS - Service Preparation System
            </p>

        </div>

    </body>
    </html>
